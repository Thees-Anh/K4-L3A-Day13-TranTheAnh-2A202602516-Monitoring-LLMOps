service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Trong cửa sổ 28 ngày, tối đa 0.5% request được phép lỗi hoặc vượt 3000 ms.
    Tương đương 500 bad requests trên mỗi 100000 requests; nếu quy đổi theo thời
    gian thì error budget là 201.6 phút trên 28 ngày. Baseline CP1 có P95 khoảng
    1.1 giây nên ngưỡng 3 giây tạo đủ khoảng đệm nhưng vẫn phát hiện tail latency.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
