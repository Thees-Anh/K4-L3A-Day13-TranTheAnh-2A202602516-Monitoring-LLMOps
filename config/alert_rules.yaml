alerts:
  - name: HighTailLatency
    severity: warning
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: llm-platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: llm-platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccessRate
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 10m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: rag-oncall
    runbook: docs/alerts.md#alert-3
